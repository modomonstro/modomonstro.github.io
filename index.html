<style>
/* Layout: aplicativo de celular — uma tela por vez, botão grande embaixo, barra de abas fixa; no computador, a "tela do celular" fica centralizada. */

}

  --red: #E0263F; --red-ink: #FF7A8A; --on-red: #FFFFFF; --good: #3CC489; --amber: #F0A43A;
  --plate-salad: #4C9A4C; --plate-prot: #C25A40; --plate-carb: #D69632; --plate-fat: #8AA834; color-scheme: dark } }
:root[data-theme="dark"] {

  --plate-salad: #4C9A4C; --plate-prot: #C25A40; --plate-carb: #D69632; --plate-fat: #8AA834; color-scheme: dark }
html, body { height: 100%; }

nav.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

}

<script>
(() => {
"use strict";
/* ================== utilidades ================== */
const $ = (s, el = document) => el.querySelector(s);
const fmt = (n, d = 1) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const clamp = (v, a = 0, b = 10) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mem = { get(k, d) { try { const v = localStorage.getItem("monstro-" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("monstro-" + k, JSON.stringify(v)); return true; } catch { return false; } } };

const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================== estado ================== */
const S = Object.assign({ sexo: null, idade: 28, altura: 175, peso: 80, pescoco: 38, cintura: 88, ombro: 115, quadril: 100, braco: 34, modo: null, bfEscolhido: null, local: null, nivel: null }, mem.get("perfil", {}));

const salvarPerfil = () => mem.set("perfil", S);

/* ================== cálculo do Raio-X ================== */
function calcular(m) {
  const h = m.altura, hm = h / 100, log = Math.log10, homem = m.sexo === "m";
  let bf;
  if (m.modo === "fita") bf = homem ? 495 / (1.0324 - 0.19077 * log(m.cintura - m.pescoco) + 0.15456 * log(h)) - 450
                                   : 495 / (1.29579 - 0.35004 * log(m.cintura + m.quadril - m.pescoco) + 0.221 * log(h)) - 450;
  else bf = m.bfEscolhido;
  bf = clamp(bf, 4, 55);
  const magra = m.peso * (1 - bf / 100);
  const ffmi = magra / (hm * hm) + 6.1 * (1.8 - hm);
  const lim = homem ? 25 : 21, base = homem ? 16 : 13, ideal = homem ? 12 : 20;
  const sMus = clamp((ffmi - base) / (lim - base) * 10);
  const sDef = clamp(bf <= (homem ? 10 : 18) ? 10 : 10 - (bf - (homem ? 10 : 18)) * 0.5);
  let sSau = null, sPro = null, prop = null, whtr = null;
  if (m.modo === "fita") {
    whtr = m.cintura / h; sSau = clamp((0.6 - whtr) / 0.15 * 10);
    if (homem) { prop = m.ombro / m.cintura; sPro = clamp((prop - 1.15) / (1.618 - 1.15) * 10); }
    else { prop = m.cintura / m.quadril; sPro = clamp((0.95 - prop) / 0.25 * 10); }
  }
  const partes = [sMus, sDef, sSau, sPro].filter((x) => x !== null);
  const nota = partes.reduce((a, b) => a + b, 0) / partes.length;
  const faltaMus = Math.max(0, (lim - ffmi) * hm * hm);
  const pesoAlvo = magra / (1 - ideal / 100);
  const perder = Math.max(0, m.peso - pesoAlvo);
  const caso = bf > (homem ? 20 : 30) ? "secar" : sMus < 5 ? "crescer" : bf > ideal + 3 ? "recompor" : "lapidar";
  const pesoRef = caso === "secar" ? pesoAlvo : m.peso;
  return { bf, magra, ffmi, lim, sMus, sDef, sSau, sPro, prop, whtr, nota, faltaMus, perder, caso, ideal,
    prot: Math.round(1.8 * pesoRef), semanas: perder > 0.5 ? [Math.ceil(perder / (m.peso * 0.01)), Math.ceil(perder / (m.peso * 0.005))] : null };
}
const nivelDe = (n) => n >= 9 ? "Monstro" : n >= 8 ? "Quase monstro" : n >= 6 ? "Shape de respeito" : n >= 4 ? "Em construção" : "Começando a jornada";
const CASO = {
  secar: ["Secar primeiro", "Tem músculo escondido debaixo da gordura. Baixando a gordura, o shape aparece."],
  crescer: ["Crescer", "Sua gordura está boa. Falta músculo: proteína alta e carga subindo toda semana."],
  recompor: ["Secar e crescer", "Dá para perder gordura e ganhar músculo ao mesmo tempo, com treino pesado e proteína alta."],
  lapidar: ["Lapidar", "Você já está bem. Agora é detalhe: carga subindo e constância."],

/* ================== navegação ================== */
let pilha = [];
function ir(tela, arg, substituir) { if (!substituir && pilha.length) pilha.push([tela, arg]); else if (!pilha.length) pilha = [[tela, arg]]; else pilha[pilha.length - 1] = [tela, arg]; render(); }

document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => raiz(b.dataset.tab)));

  cta.hidden = true; cta.innerHTML = ""; $("#progwrap").hidden = true;
  $("#back").hidden = pilha.length < 2;
  const aba = t.aba || tela;
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === aba ? "page" : "false"));
  $("#title").textContent = t.titulo || "Raio-X do Monstro";
  view.innerHTML = "";
  t.montar(arg);
  window.scrollTo(0, 0);
}
function botoes(lista) { cta.hidden = false; cta.innerHTML = ""; lista.forEach(([txt, fn, alt]) => { const b = document.createElement("button"); b.className = "btn" + (alt ? " alt" : ""); b.textContent = txt; b.onclick = fn; cta.appendChild(b); }); }
function progresso(p) { $("#progwrap").hidden = false; $("#prog").style.width = Math.round(p * 100) + "%"; }
function why(txt) { return `<div class="why"><span class="ico">?</span><p>${txt}</p></div>`; }
const ICO = {
  homem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="14" r="5"/><path d="M14 10l6-6M15 4h5v5"/></svg>',
  mulher: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/></svg>',
  fita: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg>',
  olho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  academia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>',
  casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-5h4v5"/></svg>',
  sacola: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  gota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
  prato: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>',
  lua: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  calendario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  trofeu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg>',
  palma: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 21c-2.2-1.4-4-4-4-7V9.5a1.5 1.5 0 0 1 3 0V12h.5V4.5a1.5 1.5 0 0 1 3 0V11h.5V3.5a1.5 1.5 0 0 1 3 0V11h.5V5a1.5 1.5 0 0 1 3 0v9c0 4-2.6 7-6.5 7z"/></svg>',
};

/* ================== TELAS ================== */
const TELAS = {};

/* ---------- metas do dia (sempre com a referência de cálculo) ---------- */
const ATIV = [[1.2, "não treino"], [1.375, "1 a 2 vezes por semana"], [1.55, "3 a 4 vezes por semana"], [1.725, "5 ou mais vezes por semana"]];
function metas() {
  const homem = (S.sexo || "m") === "m", peso = S.peso, alt = S.altura, idade = S.idade;
  const tmb = 10 * peso + 6.25 * alt - 5 * idade + (homem ? 5 : -161);
  const [fat, fatTxt] = ATIV[S.ativ ?? 2];
  const gasto = tmb * fat;
  const caso = R ? R.caso : "recompor";
  const ajuste = { secar: 0.8, recompor: 0.9, lapidar: 1, crescer: 1.1 }[caso];
  const kcal = Math.round(gasto * ajuste / 10) * 10;

  const prot = Math.round(1.8 * pesoRef), gord = Math.round(0.8 * peso);

  return { tmb: Math.round(tmb), fat, fatTxt, gasto: Math.round(gasto), ajuste, caso, kcal, prot, gord, carb, prazer, pesoRef: Math.round(pesoRef),
    agua: Math.round((35 * peso + [0, 250, 500, 750][S.ativ ?? 2]) / 100) / 10,
    copos: Math.ceil((35 * peso + [0, 250, 500, 750][S.ativ ?? 2]) / 200), garrafas: Math.ceil((35 * peso + [0, 250, 500, 750][S.ativ ?? 2]) / gML()) };
}
const gML = () => S.garrafa || 750; // tamanho da garrafa que a pessoa usa
const AVISO_PRO = "É uma referência feita por cálculo, não uma dieta nem um treino individual. Procure um nutricionista, um educador físico ou um médico para te acompanhar.";
const avisoBox = () => `<div class="pro"><span class="i">!</span><p><b>Importante</b>${AVISO_PRO}</p></div>`;
function referencia(linhas) { return `<details class="ref"><summary>Como calculamos</summary><ul>${linhas.map((l) => `<li>${l}</li>`).join("")}</ul><p>${AVISO_PRO}</p></details>`; }
function refMetas(m) {
  return [
    `Gasto do corpo parado (fórmula de Mifflin-St Jeor): 10 × ${fmt(S.peso, 0)} kg + 6,25 × ${S.altura} cm − 5 × ${S.idade} anos ${(S.sexo || "m") === "m" ? "+ 5" : "− 161"} = <b>${m.tmb} kcal</b>.`,
    `Com o seu treino (${m.fatTxt}): ${m.tmb} × ${fmt(m.fat, 3)} = <b>${m.gasto} kcal</b> por dia.`,
    `Seu caso é ${CASO[m.caso][0].toLowerCase()}: ${m.ajuste < 1 ? `${Math.round((1 - m.ajuste) * 100)}% a menos` : m.ajuste > 1 ? `${Math.round((m.ajuste - 1) * 100)}% a mais` : "o mesmo"} = <b>${m.kcal} kcal</b>.`,
    `Proteína: 1,8 g por kg (${m.pesoRef} kg) = <b>${m.prot} g</b>. A ciência do esporte indica de 1,6 a 2,2 g/kg para ganhar ou manter músculo.`,

/* ---------- treino do dia ---------- */
function treinoDeHoje(data = new Date()) {
  if (!S.local || !S.nivel) return { escolher: true };
  const p = PLANOS[S.local][S.nivel], d = data.getDay(); // 0 = domingo
  let idx = null;
  if (p.dias.length === 1) idx = [1, 3, 5].includes(d) ? 0 : null;
  else if (p.dias.length === 3) idx = { 1: 0, 2: 1, 3: 2, 4: 0, 5: 1, 6: 2 }[d] ?? null;
  else idx = { 1: 0, 2: 1, 4: 0, 5: 1 }[d] ?? null;
  return idx === null ? { descanso: true } : { idx, nome: p.dias[idx][0] };
}

/* ---------- registro do dia ---------- */
const hojeISO = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const diaVazio = () => ({ agua: 0, ref: {}, treino: false, sono: null, v: 3 });
const lerDia = (iso) => { const d = Object.assign(diaVazio(), mem.get("dia-" + iso, {})); if (d.v !== 3) { d.agua = 0; d.v = 3; } return d; };
const gravarDia = (iso, v) => mem.set("dia-" + iso, v);
function notaDia(iso, m) {
  const v = lerDia(iso), t = treinoDeHoje(new Date(iso + "T12:00:00"));
  const agua = Math.min(1, v.agua / m.garrafas), ref = Object.values(v.ref).filter(Boolean).length / 4;
  const treino = t.descanso ? 1 : v.treino ? 1 : 0, sono = v.sono == null ? 0 : Math.min(1, v.sono / 7);
  const algo = v.agua || Object.values(v.ref).some(Boolean) || v.treino || v.sono != null;
  return algo ? Math.round((agua + ref + treino + sono) / 4 * 100) : 0;
}
function sequencia(m) {
  let n = 0; const d = new Date();
  if (notaDia(hojeISO(d), m) < 75) d.setDate(d.getDate() - 1);
  while (notaDia(hojeISO(d), m) >= 75 && n < 400) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

  gp = Math.min(P[8] || 300, Math.max(P[6] ? P[6] / 2 : 40, gp));
  gc = Math.min(C[8] || 450, Math.max(C[6] ? C[6] / 2 : 30, gc));
  // Passou mais de 10% das calorias da refeição? Tira do carboidrato (a proteína fica).
  const kcalAgora = soma.kcal + gp * P[1] / 100 + gc * C[1] / 100;
  if (kcalAgora > alvo.kcal * 1.1) gc = Math.max(C[6] ? C[6] / 2 : 30, gc - (kcalAgora - alvo.kcal) / (C[1] / 100));
  add(e.prot, redondo(gp)); add(e.carb, redondo(gc));
  const ordem = { prot: 0, carb: 1, verd: 2, gord: 3, beb: 4 };
  itens.sort((a, b) => (ordem[tipoDe(a.id)] - ordem[tipoDe(b.id)]));
  const falta = alvo.p - soma.p;
  return { itens, soma, alvo, falta: falta > 6 ? Math.round(falta) : 0 };
}

function textoPrazer(id, m) {

  const pior = v.agua < m.garrafas ? "Amanhã, deixe a garrafa cheia do lado da cama e beba a primeira ao acordar."
    : !t.descanso && !t.escolher && !v.treino ? "Amanhã, separe a roupa do treino hoje à noite. Metade do treino é sair de casa."
    : v.sono == null || v.sono < 7 ? "Hoje, celular longe 30 minutos antes de deitar."
    : refs.some((r) => !r[1]) ? "Amanhã, deixe o lanche pronto de manhã para não pular."
    : "Repita amanhã exatamente o que você fez hoje.";
  const msg = nota >= 90 ? ["Dia de monstro!", "Você fez praticamente tudo. É assim que o shape muda: um dia desses de cada vez."]
    : nota >= 75 ? ["Dia concluído!", "Passou dos 75%: esse dia conta na sua sequência. Constância vence perfeição."]
    : nota >= 50 ? ["Meio caminho já conta", "Não foi perfeito, e tudo bem. Quem faz metade todo dia chega mais longe do que quem faz tudo uma vez só."]
    : ["Dia difícil acontece", "Sem culpa. Um dia ruim não apaga a semana. Amanhã é uma página nova, e você já sabe por onde começar."];
  view.innerHTML = `
    <div class="reveal"><p class="sub">${((s) => s.charAt(0).toUpperCase() + s.slice(1))(new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }))}</p>
      <span class="closebig">${nota}%</span><span class="pill">${fez} de ${itens.length} metas</span>
      <p class="caso">${msg[0]}</p><p>${msg[1]}</p></div>
    <div class="card checklist">${itens.map(([n, ok]) => `<div class="${ok ? "ok" : "no"}"><span>${ok ? "✓" : "✗"}</span>${esc(n)}</div>`).join("")}</div>
    <div class="why soft"><span class="ico">→</span><p><b>Para amanhã:</b> ${pior}</p></div>
    <div class="card"><h3>Que nota você dá para o seu dia?</h3>
      <div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-n="${n}" aria-pressed="${(v.minhaNota || 0) >= n}" aria-label="Nota ${n}">★</button>`).join("")}</div>
      <p class="note" id="notaTxt">${v.minhaNota ? ["", "Tudo bem. Amanhã melhora.", "Já é um começo.", "Bom dia!", "Muito bom!", "Dia perfeito!"][v.minhaNota] : "Toque nas estrelas."}</p></div>
    <p class="note">Pode fechar o dia quantas vezes quiser: o que conta é o que está marcado no Meu Dia.</p>`;
  view.querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => { v.minhaNota = +b.dataset.n; gravarDia(iso, v); render(); }));
  botoes([["Fechar o dia", () => { v.fechado = true; gravarDia(iso, v); conferirConquistas(); raiz("home"); aviso(nota >= 75 ? "🔥 <b>Dia fechado!</b> Mais um no caminho." : "✓ <b>Dia fechado.</b> Amanhã a gente continua."); }]]);
} };

/* ---------- Acesso de quem comprou (código da área de membros da Cakto) ---------- */
const CODIGOS = ["c1e2f31efba69eba4ab5267c496487810a582020eaa86374982a3b8384f25f68"]; // sha256 do código do mês; ver ACESSO.md
async function hashTexto(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); }
TELAS.acesso = { aba: "none", titulo: "Raio-X do Monstro", montar() {
  document.querySelector("nav.tabbar").hidden = true;
  view.innerHTML = `<h2>Bem-vindo ao Raio-X do Monstro</h2>
    ${why("Digite o <b>código de acesso</b> que está na sua área de membros, junto com o link do app. É só uma vez: depois o celular lembra.")}
    <label class="ask" for="cod"><span class="sub">Código de acesso</span><input id="cod" class="codin" autocomplete="off" autocapitalize="characters" placeholder="MONSTRO-XXXXX"></label>
    <p class="note" id="codmsg"></p>`;
  const entrar = async () => {
    const v = $("#cod").value.trim().toUpperCase().replace(/\s+/g, "");
    let ok = false; try { ok = CODIGOS.includes(await hashTexto(v)); } catch {}
    if (ok) { mem.set("acesso", true); document.querySelector("nav.tabbar").hidden = false; raiz("home"); aviso("💪 <b>Acesso liberado!</b> Bora começar."); }
    else $("#codmsg").textContent = "Esse código não confere. Ele está na sua área de membros, junto com o link do app.";
  };
  $("#cod").addEventListener("keydown", (e) => { if (e.key === "Enter") entrar(); });
  botoes([["Entrar", entrar]]);
} };

raiz(mem.get("acesso", false) ? "home" : "acesso");
})();
