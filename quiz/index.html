<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D7193A">
<link rel="icon" href="../img/icone-180.png">
<link rel="apple-touch-icon" href="../img/icone-180.png">
<title>Qual a nota do seu shape?</title>
<meta name="description" content="Teste grátis do Modo Monstro: descubra em 2 minutos a nota do seu shape e se você precisa secar ou crescer.">
<meta property="og:title" content="Qual a nota do seu shape?">
<meta property="og:description" content="Teste grátis em 2 minutos. Do Modo Monstro.">
<meta property="og:image" content="https://modomonstro.github.io/img/hero-h.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Página de vendas do Raio-X do Monstro: escura, com o corpo em raio-x vermelho; quiz uma pergunta por tela; no fim, a nota e a oferta com telinhas do app. */
:root { --bg: #F4F5F7; --panel: #FFFFFF; --panel2: #EEF0F3; --ink: #111317; --muted: #5C636C; --line: #E0E3E8; --red: #D7193A; --red-glow: rgba(215,25,58,.28); --good: #17804F; --gold: #B86B00;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
  background-image: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px); background-size: 28px 28px; }
[hidden] { display: none !important; }
.app { max-width: 520px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px max(18px, env(safe-area-inset-left, 0px)); }
.brand { font: 400 20px var(--display); letter-spacing: 1px; text-transform: uppercase; } .brand b { color: var(--red); font-weight: 400; }
.handle { font: 600 12px var(--mono); color: var(--muted); }
.prog { height: 4px; background: var(--line); margin: 0 max(18px, env(safe-area-inset-left, 0px)); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--red); box-shadow: 0 0 12px var(--red-glow); transition: width .35s ease; }
main { flex: 1; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 130px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .4px; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(46px, 13vw, 64px); } h2 { font-size: clamp(32px, 9vw, 42px); } h3 { font-size: 22px; }
h1 em, h2 em { font-style: normal; color: var(--red); text-shadow: 0 0 24px var(--red-glow); }
p { margin: 0; } .sub { color: var(--muted); }
.hero { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1; background: #000; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 40%); }
.hero .scanline { position: absolute; left: 0; right: 0; height: 3px; background: var(--red); box-shadow: 0 0 22px 6px var(--red-glow); top: 20%; animation: scan 2.6s ease-in-out infinite alternate; z-index: 1; }
@keyframes scan { to { top: 78%; } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips span { font: 700 12.5px var(--body); letter-spacing: .4px; padding: 7px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.cta { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; }
.btn { display: block; width: 100%; font: 800 18px var(--body); letter-spacing: .3px; background: var(--red); color: #fff; border: 0; border-radius: 16px; padding: 18px; cursor: pointer; text-align: center; text-decoration: none; box-shadow: 0 10px 30px -8px var(--red-glow), inset 0 1px 0 rgba(255,255,255,.25); }
.btn:active { transform: translateY(1px); }
.btn small { display: block; font: 600 12.5px var(--body); opacity: .85; margin-top: 2px; }
.choices { display: grid; gap: 10px; }
.choice { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 17px 16px; font: 700 18px var(--body); color: var(--ink); cursor: pointer; text-align: left; width: 100%; transition: border-color .15s ease, background .15s ease; }
.choice:hover { border-color: var(--red); background: var(--panel2); }
.choice .k { width: 34px; height: 34px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 15px var(--mono); color: var(--muted); flex: none; }
.bodies { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bodies button { background: #FFFFFF; border: 2px solid var(--line); border-radius: 14px; padding: 6px 6px 8px; cursor: pointer; color: #121417; font: 800 15px var(--mono); display: grid; gap: 4px; }
.bodies button:hover { border-color: var(--red); }
.bodies img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: center 30%; border-radius: 10px; }
.num { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; display: grid; gap: 14px; justify-items: center; }
.num .v { font: 400 78px/1 var(--display); } .num .v small { font: 600 18px var(--body); color: var(--muted); margin-left: 6px; text-shadow: none; }
.num .row { display: flex; gap: 16px; align-items: center; }
.num .row button { width: 58px; height: 58px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: 700 28px var(--body); cursor: pointer; }
input[type=range] { width: 100%; accent-color: var(--red); height: 34px; }
.center { text-align: center; display: grid; gap: 10px; justify-items: center; }
.dial { width: 220px; height: 220px; position: relative; filter: drop-shadow(0 6px 18px var(--red-glow)); } .dial svg { width: 100%; height: 100%; }
.dial .v { position: absolute; inset: 0; display: grid; place-items: center; } .dial b { font: 400 88px/1 var(--display); } .dial span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.pill { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 7px 14px; border-radius: 99px; background: var(--red); color: #fff; box-shadow: 0 0 18px var(--red-glow); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; } .stat span { display: block; font-size: 12.5px; color: var(--muted); } .stat b { font: 600 24px var(--mono); }
.sec { display: grid; gap: 14px; padding-top: 14px; }
.eyebrow { font: 800 12px var(--body); letter-spacing: 2px; text-transform: uppercase; color: var(--red); }
.phones { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 2px 14px; margin: 0 -4px; }
.phone { flex: 0 0 210px; scroll-snap-align: center; background: #F6F7F9; color: #121417; border-radius: 30px; padding: 12px 10px 14px; border: 6px solid #1E2127; box-shadow: 0 18px 40px -18px rgba(0,0,0,.45); display: grid; gap: 8px; align-content: start; min-height: 360px; }
.phone .bar { background: #C8102E; color: #fff; border-radius: 12px; padding: 8px 10px; font: 400 14px var(--display); letter-spacing: .5px; text-transform: uppercase; }
.phone .mini { background: #fff; border: 1px solid #DADEE3; border-radius: 12px; padding: 9px; font-size: 12px; display: grid; gap: 5px; }
.phone .mini b { font-size: 13px; }
.phone .big { font: 400 44px/1 var(--display); text-align: center; color: #121417; }
.phone .ok { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; } .phone .ok i { width: 18px; height: 18px; border-radius: 99px; background: #17804F; color: #fff; font-style: normal; display: grid; place-items: center; font-size: 11px; }
.phone .ok.no i { background: #DADEE3; color: #5C636C; }
.phone .foods { display: flex; gap: 5px; } .phone .foods figure { margin: 0; text-align: center; font: 400 15px var(--display); } .phone .foods img { width: 50px; height: 50px; border-radius: 9px; background: #EEF0F3; display: block; }
.phone small { color: #5C636C; text-align: center; font-size: 11.5px; font-weight: 600; }
.stack { display: grid; gap: 8px; }
.stack div { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.stack div::before { content: "✓"; width: 26px; height: 26px; border-radius: 99px; background: rgba(23,128,79,.12); color: var(--good); display: grid; place-items: center; font-weight: 900; }
.stack b { display: block; }
.stack small { color: var(--muted); font-size: 13px; }
.price { background: radial-gradient(120% 120% at 50% 0%, rgba(224,38,63,.22), transparent 60%), var(--panel); border: 1.5px solid var(--red); border-radius: 22px; padding: 22px 18px; text-align: center; display: grid; gap: 6px; box-shadow: 0 0 40px -12px var(--red-glow); }
.price .v { font: 400 72px/1 var(--display); } .price .v small { font: 700 20px var(--body); vertical-align: top; margin-right: 4px; }
.faq details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.faq summary { font-weight: 800; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; } .faq summary::after { content: "+"; color: var(--red); font-size: 20px; line-height: 1; }
.faq details[open] summary::after { content: "−"; } .faq details p { color: var(--muted); margin-top: 8px; font-size: 15px; }
.faq { display: grid; gap: 8px; }
.note { font-size: 12.5px; color: var(--muted); }
.scanbox { position: relative; width: 220px; margin: 20px auto 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.scanbox img { width: 100%; display: block; } .scanbox .scanline { position: absolute; left: 0; right: 0; height: 3px; background: var(--red); box-shadow: 0 0 22px 6px var(--red-glow); top: 10%; animation: scan 1.1s ease-in-out infinite alternate; }
.what { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; align-items: start; } .what img { border-radius: 12px; }
.steps3 { display: grid; gap: 10px; } .steps3 div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px 60px; position: relative; } .steps3 span { position: absolute; left: 14px; top: 14px; width: 34px; height: 34px; border-radius: 99px; background: var(--red); display: grid; place-items: center; font: 400 18px var(--display); box-shadow: 0 0 14px var(--red-glow); } .steps3 b { display: block; font-size: 17px; } .steps3 p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.grp2 { display: grid; gap: 8px; margin-top: 6px; } .gname { font: 400 20px var(--display); text-transform: uppercase; letter-spacing: .4px; color: var(--ink); }
.weeks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .weeks div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; } .weeks small { color: var(--red); font-weight: 800; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; } .weeks b { display: block; margin: 4px 0; } .weeks p { color: var(--muted); font-size: 14px; }
.fit { display: grid; gap: 10px; } .fit > div { border-radius: 16px; padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); } .fit ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 15px; } .fit .yes b { color: var(--good); } .fit .no b { color: #C62828; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="brand"><img src="../img/icone-180.png" alt="" width="30" height="30" style="vertical-align:-8px;margin-right:8px;border-radius:7px">Raio-X do <b>Monstro</b></span><span class="handle">@modomonstrotv</span></div>
  <div class="prog"><i id="prog"></i></div>
  <main id="v"></main>
  <div class="cta" id="cta" hidden></div>
</div>
<script>
(() => {
"use strict";
const CHECKOUT = "https://pay.cakto.com.br/8jevued_1359959"; // checkout da Cakto (R$ 37, acesso de 1 ano)
const $ = (s) => document.querySelector(s), v = $("#v"), cta = $("#cta");
const fmt = (n, d = 1) => Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const clamp = (x, a = 0, b = 10) => Math.max(a, Math.min(b, x));
const guarda = (k, x) => { try { localStorage.setItem("monstro-" + k, JSON.stringify(x)); } catch {} };
const S = { sexo: "m", idade: 28, altura: 175, peso: 80, bfEscolhido: null, ativ: 2, objetivo: null };
const prog = (p) => ($("#prog").style.width = Math.round(p * 100) + "%");
function botao(txt, fn, sub) {
  cta.hidden = false; cta.innerHTML = "";
  const b = document.createElement(fn ? "button" : "a"); b.className = "btn"; b.innerHTML = txt + (sub ? `<small>${sub}</small>` : "");
  if (fn) b.onclick = fn; else { b.href = CHECKOUT; b.target = "_blank"; b.rel = "noopener"; }
  cta.appendChild(b);
}
const PASSOS = ["sexo", "idade", "altura", "peso", "corpo", "ativ", "objetivo"];
function tela(i) {
  window.scrollTo(0, 0); cta.hidden = true; prog(i / (PASSOS.length + 1));
  const p = PASSOS[i], passo = `<p class="eyebrow">Pergunta ${i + 1} de ${PASSOS.length}</p>`;
  if (p === "sexo") { v.innerHTML = `${passo}<h2>Você é…</h2><div class="choices"><button class="choice" data-x="m"><span class="k">H</span>Homem</button><button class="choice" data-x="f"><span class="k">M</span>Mulher</button></div>`;
    v.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { S.sexo = b.dataset.x; if (S.sexo === "f") { S.altura = 163; S.peso = 63; } tela(i + 1); })); return; }
  if (["idade", "altura", "peso"].includes(p)) {
    const cfg = { idade: ["Quantos anos você tem?", "anos", 18, 80, 1], altura: ["Qual a sua altura?", "cm", 140, 210, 1], peso: ["Quanto você pesa?", "kg", 40, 180, 0.5] }[p];
    v.innerHTML = `${passo}<h2>${cfg[0]}</h2><div class="num"><div class="row"><button data-d="-1" aria-label="Diminuir">−</button><span class="v"><span id="nv"></span><small>${cfg[1]}</small></span><button data-d="1" aria-label="Aumentar">+</button></div><input type="range" id="rg" min="${cfg[2]}" max="${cfg[3]}" step="${cfg[4]}" value="${S[p]}" aria-label="${cfg[0]}"></div>`;
    const pinta = () => { $("#nv").textContent = fmt(S[p], cfg[4] < 1 ? 1 : 0); $("#rg").value = S[p]; };
    $("#rg").oninput = (e) => { S[p] = +e.target.value; pinta(); };
    v.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { S[p] = clamp(+(S[p] + +b.dataset.d * cfg[4]).toFixed(1), cfg[2], cfg[3]); pinta(); }));
    pinta(); botao("Próximo", () => tela(i + 1)); return; }
  if (p === "corpo") { const op = S.sexo === "m" ? [10, 15, 20, 25, 30, 35] : [15, 20, 25, 30, 35, 40];
    v.innerHTML = `${passo}<h2>Qual corpo parece mais com o seu?</h2><p class="sub">Olhe a barriga e a cintura. Na dúvida, escolha o do meio.</p><div class="bodies">${op.map((x) => `<button data-x="${x}"><img src="../img/corpo-${S.sexo === "m" ? "h" : "m"}-${x}.jpg" alt="Corpo com cerca de ${x}% de gordura">${x}%</button>`).join("")}</div>`;
    v.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { S.bfEscolhido = +b.dataset.x; tela(i + 1); })); return; }
  if (p === "ativ") { const op = ["Não treino", "1 a 2 vezes por semana", "3 a 4 vezes por semana", "5 ou mais vezes"];
    v.innerHTML = `${passo}<h2>Quantas vezes você treina por semana?</h2><div class="choices">${op.map((t, k) => `<button class="choice" data-x="${k}"><span class="k">${k}</span>${t}</button>`).join("")}</div>`;
    v.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { S.ativ = +b.dataset.x; tela(i + 1); })); return; }
  if (p === "objetivo") { v.innerHTML = `${passo}<h2>O que você mais quer?</h2><div class="choices">${[["secar", "Secar a barriga"], ["crescer", "Ganhar músculo"], ["os dois", "Os dois"]].map(([k, t], n) => `<button class="choice" data-x="${k}"><span class="k">${n + 1}</span>${t}</button>`).join("")}</div>`;
    v.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { S.objetivo = b.dataset.x; calculando(); })); return; }
}
function calculando() {
  prog(1); cta.hidden = true; window.scrollTo(0, 0);
  v.innerHTML = `<div class="center"><div class="scanbox"><img src="../img/hero-${S.sexo === "m" ? "h" : "m"}.jpg" alt=""><span class="scanline"></span></div><h2>Escaneando seu shape…</h2><p class="sub" id="pa">Medindo sua gordura</p></div>`;
  const t = ["Calculando seu músculo", "Comparando com o limite natural", "Montando seu resultado"]; let k = 0;
  const tick = () => { if (k < t.length) { $("#pa").textContent = t[k++]; setTimeout(tick, 700); } else resultado(); }; setTimeout(tick, 700);
}
function resultado() {
  window.scrollTo(0, 0);
  const homem = S.sexo === "m", hm = S.altura / 100;
  // % de gordura = média da figura escolhida com a fórmula de Deurenberg (IMC, idade e sexo; Deurenberg e colegas, 1991).
  const imc0 = S.peso / (hm * hm), deur = 1.2 * imc0 + 0.23 * S.idade - 10.8 * (homem ? 1 : 0) - 5.4;
  const bf = Math.round(clamp((S.bfEscolhido + deur) / 2, homem ? 5 : 12, 55));
  const magra = S.peso * (1 - bf / 100), ffmi = magra / (hm * hm) + 6.1 * (1.8 - hm);
  const lim = homem ? 25 : 21, base = homem ? 16 : 13;
  const sMus = clamp((ffmi - base) / (lim - base) * 10), sDef = clamp(bf <= (homem ? 10 : 18) ? 10 : 10 - (bf - (homem ? 10 : 18)) * 0.5);
  const nota = (sMus + sDef) / 2, imc = S.peso / (hm * hm), falta = Math.max(0, (lim - ffmi) * hm * hm);
  const caso = bf > (homem ? 20 : 30) ? "secar primeiro" : sMus < 5 ? "crescer" : "secar e crescer";
  const nivel = nota >= 9 ? "Monstro" : nota >= 8 ? "Quase monstro" : nota >= 6 ? "Shape de respeito" : nota >= 4 ? "Em construção" : "Começando a jornada";
  const prot = Math.round(1.8 * S.peso), agua = Math.round((35 * S.peso + [0, 250, 500, 750][S.ativ]) / 100) / 10;
  guarda("perfil", { sexo: S.sexo, idade: S.idade, altura: S.altura, peso: S.peso, modo: "olho", bfEscolhido: bf, ativ: S.ativ });
  const img = (n) => `../img/comida-${n}.jpg`;
  v.innerHTML = `
    <div class="center"><p class="eyebrow">Seu resultado</p>
      <div class="dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="#E0E3E8" stroke-width="11"/><circle id="ring" cx="60" cy="60" r="50" fill="none" stroke="#D7193A" stroke-width="11" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.3s ease"/></svg><div class="v"><div><b id="nb">0,0</b><span>nota do shape</span></div></div></div>
      <span class="pill">${nivel}</span><p style="font-size:18px">Seu caso: <b>${caso}</b>.</p></div>
    <div class="stats">
      <div class="stat"><span>Gordura estimada</span><b>${bf}%</b></div>
      <div class="stat"><span>IMC</span><b>${fmt(imc)}</b></div>
      <div class="stat"><span>Potencial muscular (estim.)</span><b>+${fmt(falta)} kg</b></div>
      <div class="stat"><span>Ideal de shape</span><b>${homem ? "10–12%" : "18–22%"}</b></div>
    </div>
    <p class="note" style="text-align:center">% de gordura estimado pelo seu peso, altura, idade e pelo corpo que você escolheu (fórmula de Deurenberg). Com fita métrica, o app completo calcula pela fórmula da Marinha dos EUA, mais precisa.</p>
    <p class="sub" style="text-align:center">Tire print e poste marcando <b style="color:var(--ink)">@modomonstrotv</b>.</p>

    <section class="sec">
      <div class="hero"><img src="../img/hero-${homem ? "h" : "m"}.jpg" alt="Corpo em raio-x com linhas de medição"><span class="scanline"></span></div>
      <p class="eyebrow">Você descobriu sua nota. E agora?</p>
      <h2>Você já sabe a nota do seu shape. Agora descubra <em>por onde começar</em>.</h2>
